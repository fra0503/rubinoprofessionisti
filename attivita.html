<a class="skip" href="#main">Vai al contenuto</a><header class="site-header" id="siteHeader"></header>
<main class="page" id="main">
  <div class="page-head"><div><p class="eyebrow">Solo amministratore</p><h1>Attività</h1><p class="sub">Il registro delle operazioni importanti: chi, cosa, su quale record e quando. Non è modificabile né cancellabile da nessun utente.</p></div><button class="btn btn-ghost" id="csv" type="button">Esporta in CSV</button></div>
  <div class="toolbar tb4"><div class="field"><label for="search">Cerca nell'azione</label><input id="search" type="search" autocomplete="off" maxlength="80"></div>
  <div class="field"><label for="ent">Tipo di record</label><select id="ent"><option value="">Tutti</option><option value="properties">Immobili</option><option value="client_requests">Richieste</option><option value="matches">Abbinamenti</option><option value="profiles">Professionisti</option><option value="invites">Inviti</option></select></div>

</main><footer class="site-footer">Rubino Immobiliare — Una rete costruita sulla fiducia.</footer><script type="module" src="/js/attivita.js?v=4"></script></body></html>
