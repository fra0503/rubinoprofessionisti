<!doctype html><html lang="it"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B2A3F"><meta name="robots" content="noindex"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/rubino-mark.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/rubino.css?v=4"><title>Inviti — Rubino Rete Professionisti</title></head><body>
<a class="skip" href="#main">Vai al contenuto</a><header class="site-header" id="siteHeader"></header>
<main class="page" id="main">
  <div class="page-head"><div><p class="eyebrow">Solo amministratore</p><h1>Inviti</h1><p class="sub">Si entra solo su invito. Ogni link è personale, vale una volta sola e scade dopo 72 ore.</p></div></div>
  <section class="panel" aria-labelledby="ih"><h2 id="ih">Invita un professionista</h2>
   <form id="iform" novalidate><div class="fgrid">
    <div class="field"><label for="i_name">Nome e cognome *</label><input id="i_name" maxlength="120" autocomplete="off" required></div>
    <div class="field"><label for="i_email">Email *</label><input id="i_email" type="email" inputmode="email" maxlength="254" autocomplete="off" required></div>
    <div class="field"><label for="i_prof">Categoria professionale</label><select id="i_prof"></select></div>
    <div class="field"><label for="i_notes">Note (solo per te)</label><input id="i_notes" maxlength="500" autocomplete="off"></div>
    <div class="field check wide"><label><input type="checkbox" id="i_send"> Prova a inviare l'email di invito (richiede un servizio email configurato; altrimenti ti darò il link da inviare tu)</label></div>
   </div><div id="iErr" class="notice error" role="alert" hidden></div><div class="actions"><button class="btn btn-primary" id="iBtn" type="submit">Crea invito</button></div></form></section>
  <div class="toolbar"><div class="field"><label for="filter">Mostra</label><select id="filter"><option value="">Tutti gli inviti</option><option value="pending">In attesa</option><option value="accepted">Accettati</option><option value="revoked">Revocati</option></select></div></div>
  <div id="list" aria-live="polite"></div><nav class="pager" id="pager" hidden aria-label="Pagine"><button class="btn btn-ghost" id="prev" type="button">← Precedente</button><span id="pinfo"></span><button class="btn btn-ghost" id="next" type="button">Successiva →</button></nav>
</main><footer class="site-footer">Rubino Immobiliare — Una rete costruita sulla fiducia.</footer><script type="module" src="/js/inviti.js?v=4"></script></body></html>
