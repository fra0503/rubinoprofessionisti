<!doctype html><html lang="it"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B2A3F"><meta name="robots" content="noindex"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/rubino-mark.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/rubino.css?v=4"><title>Accesso — Rubino Rete Professionisti</title></head><body>
<a class="skip" href="#main">Vai al contenuto</a>
<div class="auth"><aside class="auth-brand"><img class="auth-logo" src="/assets/rubino-logo-originale.png" alt="Rubino Immobiliare — Il valore della tua casa"><h2>Le opportunità nascono dalle connessioni giuste.</h2><p>RETE PROFESSIONISTI</p></aside>
<main class="auth-panel" id="main"><div class="auth-card">
  <p class="eyebrow">Area riservata</p><h1 id="title">Accedi alla rete</h1>
  <p class="lead" id="lead">Inserisci le credenziali del tuo account Rubino.</p>
  <div id="msg" role="alert" hidden></div>
  <form id="loginForm" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" inputmode="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Accedi</button>
    <p class="auth-foot"><button class="btn-link" type="button" id="forgotBtn">Password dimenticata?</button></p>
  </form>
  <form id="resetForm" novalidate hidden>
    <div class="field"><label for="resetEmail">Email dell'account</label><input id="resetEmail" type="email" autocomplete="email" inputmode="email" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit" id="resetBtn">Invia il link di recupero</button>
    <p class="auth-foot"><button class="btn-link" type="button" id="backBtn">Torna all'accesso</button></p>
  </form>
  <p class="auth-foot">L'accesso è riservato ai professionisti invitati da Rubino Immobiliare.</p>
</div></main></div>
<script type="module" src="/js/accesso.js?v=4"></script></body></html>
